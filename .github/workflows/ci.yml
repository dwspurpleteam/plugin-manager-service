name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: gradle/actions/setup-gradle@v4
      - name: Install EasyP
        run: |
          mkdir -p "$RUNNER_TEMP/easyp-bin"
          GOBIN="$RUNNER_TEMP/easyp-bin" go install github.com/easyp-tech/easyp/cmd/easyp@v0.17.0
      - name: Run linter
        env:
          EASYP_BIN: ${{ runner.temp }}/easyp-bin/easyp
        run: ./gradlew detekt

  assemble:
    name: Assemble
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: gradle/actions/setup-gradle@v4
      - name: Install EasyP
        run: |
          mkdir -p "$RUNNER_TEMP/easyp-bin"
          GOBIN="$RUNNER_TEMP/easyp-bin" go install github.com/easyp-tech/easyp/cmd/easyp@v0.17.0
      - name: Build application
        env:
          EASYP_BIN: ${{ runner.temp }}/easyp-bin/easyp
        run: ./gradlew assemble

      - name: Upload Quarkus application
        uses: actions/upload-artifact@v4
        with:
          name: quarkus-app
          path: build/quarkus-app
          if-no-files-found: error

  test:
    name: Tests
    needs: assemble
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: gradle/actions/setup-gradle@v4
      - name: Install EasyP
        run: |
          mkdir -p "$RUNNER_TEMP/easyp-bin"
          GOBIN="$RUNNER_TEMP/easyp-bin" go install github.com/easyp-tech/easyp/cmd/easyp@v0.17.0
      - name: Run unit tests
        env:
          EASYP_BIN: ${{ runner.temp }}/easyp-bin/easyp
        run: ./gradlew test

  integration-test:
    name: Integration tests
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: gradle/actions/setup-gradle@v4
      - name: Install EasyP
        run: |
          mkdir -p "$RUNNER_TEMP/easyp-bin"
          GOBIN="$RUNNER_TEMP/easyp-bin" go install github.com/easyp-tech/easyp/cmd/easyp@v0.17.0
      - name: Run integration tests
        env:
          EASYP_BIN: ${{ runner.temp }}/easyp-bin/easyp
        run: ./gradlew integrationTest

  publish-native-image:
    name: Native image
    needs: integration-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: gradle/actions/setup-gradle@v4
      - name: Install EasyP
        run: |
          mkdir -p "$RUNNER_TEMP/easyp-bin"
          GOBIN="$RUNNER_TEMP/easyp-bin" go install github.com/easyp-tech/easyp/cmd/easyp@v0.17.0
      - name: Build and test native executable
        env:
          EASYP_BIN: ${{ runner.temp }}/easyp-bin/easyp
        run: |
          ./gradlew nativeTest \
            -Dquarkus.native.enabled=true \
            -Dquarkus.native.container-build=true \
            -Dquarkus.package.jar.enabled=false
      - name: Read project version
        id: project-version
        run: |
          echo "version=$(./gradlew -q properties | sed -n 's/^version: //p')" >> "$GITHUB_OUTPUT"
      - name: Build native Docker image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/plugin-manager-native-${{ github.ref_name }}
          VERSION: ${{ steps.project-version.outputs.version }}
        run: docker build --file src/main/docker/Dockerfile.native --tag "$IMAGE:$VERSION" .
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish native Docker image
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/plugin-manager-native-${{ github.ref_name }}
          VERSION: ${{ steps.project-version.outputs.version }}
        run: docker push "$IMAGE:$VERSION"
