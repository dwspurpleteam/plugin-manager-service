name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: gradle/actions/setup-gradle@v4
      - name: Install EasyP
        run: |
          mkdir -p "$RUNNER_TEMP/easyp-bin"
          GOBIN="$RUNNER_TEMP/easyp-bin" go install github.com/easyp-tech/easyp/cmd/easyp@v0.17.0
      - name: Run linter
        env:
          EASYP_BIN: ${{ runner.temp }}/easyp-bin/easyp
        run: ./gradlew detekt

  assemble:
    name: Assemble
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: gradle/actions/setup-gradle@v4
      - name: Install EasyP
        run: |
          mkdir -p "$RUNNER_TEMP/easyp-bin"
          GOBIN="$RUNNER_TEMP/easyp-bin" go install github.com/easyp-tech/easyp/cmd/easyp@v0.17.0
      - name: Build application
        env:
          EASYP_BIN: ${{ runner.temp }}/easyp-bin/easyp
        run: ./gradlew assemble

  test:
    name: Tests
    needs: assemble
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: gradle/actions/setup-gradle@v4
      - name: Install EasyP
        run: |
          mkdir -p "$RUNNER_TEMP/easyp-bin"
          GOBIN="$RUNNER_TEMP/easyp-bin" go install github.com/easyp-tech/easyp/cmd/easyp@v0.17.0
      - name: Run unit tests
        env:
          EASYP_BIN: ${{ runner.temp }}/easyp-bin/easyp
        run: ./gradlew test

  integration-test:
    name: Integration tests
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: gradle/actions/setup-gradle@v4
      - name: Install EasyP
        run: |
          mkdir -p "$RUNNER_TEMP/easyp-bin"
          GOBIN="$RUNNER_TEMP/easyp-bin" go install github.com/easyp-tech/easyp/cmd/easyp@v0.17.0
      - name: Run integration tests
        env:
          EASYP_BIN: ${{ runner.temp }}/easyp-bin/easyp
        run: ./gradlew integrationTest

  publish-image:
    name: Build and publish Docker image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    needs: integration-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Quarkus application
        run: ./gradlew quarkusBuild

      - name: Read project version
        id: project-version
        run: |
          echo "version=$(./gradlew -q properties | sed -n 's/^version: //p')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/plugin-manage-service
          tags: |
            type=raw,value=${{ steps.project-version.outputs.version }}-${{ github.ref_name }}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
