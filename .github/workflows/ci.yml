name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew detekt

  assemble:
    name: Assemble
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: gradle/actions/setup-gradle@v4
      - name: Install EasyP
        run: |
          go install github.com/easyp-tech/easyp/cmd/easyp@v0.17.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build application
        run: ./gradlew assemble

  test:
    name: Tests
    needs: assemble
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: gradle/actions/setup-gradle@v4
      - name: Install EasyP
        run: |
          go install github.com/easyp-tech/easyp/cmd/easyp@v0.17.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run unit tests
        run: ./gradlew test

  integration-test:
    name: Integration tests
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: gradle/actions/setup-gradle@v4
      - name: Install EasyP
        run: |
          go install github.com/easyp-tech/easyp/cmd/easyp@v0.17.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run integration tests
        run: ./gradlew integrationTest
