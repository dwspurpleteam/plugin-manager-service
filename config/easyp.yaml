generate:
  inputs:
    - directory: proto
  plugins:
    # The Java output provides Protobuf runtime message classes.
    - name: java
      out: build/generated/sources/protobuf/main/java
    # The Kotlin output provides idiomatic Kotlin DSL wrappers for those messages.
    - name: kotlin
      out: build/generated/sources/protobuf/main/kotlin
