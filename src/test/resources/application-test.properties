# Stable Plugin Manager policy used by unit and contract tests.
plugin-manager.http.connect-timeout=PT2S
plugin-manager.http.request-timeout=PT5S
plugin-manager.http.search-timeout=PT10S
plugin-manager.http.concurrency=8
plugin-manager.activation.concurrency=8
plugin-manager.activation.attempts=3
plugin-manager.activation.retry-delays=PT5S,PT15S
plugin-manager.health.timeout=PT3S
plugin-manager.health.interval=PT30S
plugin-manager.health.failure-threshold=3
plugin-manager.health.concurrency=16
plugin-manager.worker.poll-interval=PT1S
plugin-manager.worker.lease-duration=PT30S
plugin-manager.cache.ttl=PT24H
plugin-manager.cache.timeout=PT0.5S
plugin-manager.cleanup.history-retention=P30D
plugin-manager.cleanup.interval=PT1H
plugin-manager.cleanup.batch-size=1000
plugin-manager.cleanup.inactive-routes-enabled=true
