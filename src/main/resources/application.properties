# db connection props
database.host=${DB_HOST:localhost}
database.port=${DB_PORT:5432}
database.name=${DB_NAME:plugin_manager}
database.username=${DB_USERNAME:plugin_manager}
database.password=${DB_PASSWORD:plugin_manager}
# pool connection props
database.pool.initial-size=${DB_POOL_INITIAL_SIZE:0}
database.pool.max-size=${DB_POOL_MAX_SIZE:20}
database.pool.max-idle-time=${DB_POOL_MAX_IDLE_TIME:PT30M}
database.pool.max-acquire-time=${DB_POOL_MAX_ACQUIRE_TIME:PT10S}
database.pool.max-create-connection-time=${DB_POOL_MAX_CREATE_CONNECTION_TIME:PT10S}
database.pool.validation-query=${DB_POOL_VALIDATION_QUERY:SELECT 1}
# migrator settings
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${database.username}
quarkus.datasource.password=${database.password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${database.host}:${database.port}/${database.name}
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=${DB_MIGRATION_POOL_MAX_SIZE:2}
quarkus.flyway.locations=db/migration
quarkus.flyway.migrate-at-start=true
# quarkus server props
quarkus.http.port=8080
