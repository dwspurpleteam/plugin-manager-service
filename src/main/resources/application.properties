# Local database defaults; provision the database and roles separately from Flyway.
database.host=${DB_HOST:localhost}
database.port=${DB_PORT:5432}
database.name=${DB_NAME:plugin_manager}
database.username=${DB_USERNAME:plugin_manager_app}
database.password=${DB_PASSWORD:plugin_manager_app_local_2026}
database.migration.username=${DB_MIGRATION_USERNAME:plugin_manager_migration}
database.migration.password=${DB_MIGRATION_PASSWORD:plugin_manager_migration_local_2026}
# pool connection props
database.pool.initial-size=${DB_POOL_INITIAL_SIZE:0}
database.pool.max-size=${DB_POOL_MAX_SIZE:20}
database.pool.max-idle-time=${DB_POOL_MAX_IDLE_TIME:PT30M}
database.pool.max-acquire-time=${DB_POOL_MAX_ACQUIRE_TIME:PT10S}
database.pool.max-create-connection-time=${DB_POOL_MAX_CREATE_CONNECTION_TIME:PT10S}
database.pool.validation-query=${DB_POOL_VALIDATION_QUERY:SELECT 1}
# migrator settings
quarkus.datasource.db-kind=postgresql
quarkus.datasource.active=false
quarkus.datasource.devservices.enabled=false
quarkus.datasource.migration.db-kind=postgresql
quarkus.datasource.migration.username=${database.migration.username}
quarkus.datasource.migration.password=${database.migration.password}
quarkus.datasource.migration.jdbc.url=jdbc:postgresql://${database.host}:${database.port}/${database.name}
quarkus.datasource.migration.jdbc.min-size=0
quarkus.datasource.migration.jdbc.max-size=${DB_MIGRATION_POOL_MAX_SIZE:2}
quarkus.flyway.migration.locations=db/migration
quarkus.flyway.migration.migrate-at-start=true
# quarkus server props
quarkus.http.port=8080
# OpenAPI documentation
quarkus.smallrye-openapi.store-schema-directory=docs/openapi
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true

# Plugin Manager policy defaults; registry URLs are configured per installation.
# Example: plugin-manager.registries.example-registry.url=https://registry.example.com
plugin-manager.http.connect-timeout=PT2S
plugin-manager.http.request-timeout=PT5S
plugin-manager.http.search-timeout=PT10S
plugin-manager.http.concurrency=8
plugin-manager.activation.concurrency=8
plugin-manager.activation.attempts=3
plugin-manager.activation.retry-delays=PT5S,PT15S
plugin-manager.health.timeout=PT3S
plugin-manager.health.interval=PT30S
plugin-manager.health.failure-threshold=3
plugin-manager.health.concurrency=16
plugin-manager.worker.poll-interval=PT1S
plugin-manager.worker.lease-duration=PT30S
plugin-manager.cache.ttl=PT24H
plugin-manager.cache.timeout=PT0.5S
plugin-manager.cleanup.history-retention=P30D
plugin-manager.cleanup.interval=PT1H
plugin-manager.cleanup.batch-size=1000
plugin-manager.cleanup.inactive-routes-enabled=true

# Infrastructure is explicitly configured; integration tests supply isolated Redis.
quarkus.redis.devservices.enabled=false
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

# Contract tests invoke processors explicitly instead of racing the scheduler.
%test.quarkus.scheduler.enabled=false
%test.quarkus.redis.unavailable.hosts=redis://127.0.0.1:1
